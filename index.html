<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Blogger Bot</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#0f172a;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:500px;
    background:#1e293b;
    padding:30px;
    border-radius:18px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

h1{
    margin-bottom:10px;
}

p{
    color:#94a3b8;
    margin-bottom:25px;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    background:#3b82f6;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:#2563eb;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.loader{
    display:none;
    margin:20px auto;
    width:40px;
    height:40px;
    border:4px solid rgba(255,255,255,.2);
    border-top:4px solid white;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

.result{
    margin-top:25px;
    padding:15px;
    background:#0f172a;
    border-radius:10px;
    display:none;
    text-align:left;
}

.result h3{
    margin-bottom:8px;
}

.result a{
    color:#60a5fa;
    text-decoration:none;
    word-break:break-all;
}

.success{
    border-left:5px solid #22c55e;
}

.error{
    border-left:5px solid #ef4444;
}
</style>
</head>

<body>

<div class="container">

<h1>🤖 AI Blogger Bot</h1>

<p>Generate and publish a brand-new SEO blog with one click.</p>

<button id="publishBtn">
🚀 Generate & Publish Blog
</button>

<div class="loader" id="loader"></div>

<div id="result" class="result"></div>

</div>

<script>
const API="http://127.0.0.1:8000/generate-and-publish";

const button=document.getElementById("publishBtn");
const loader=document.getElementById("loader");
const result=document.getElementById("result");

button.addEventListener("click",async()=>{

    button.disabled=true;
    loader.style.display="block";
    result.style.display="none";

    try{

        const response=await fetch(API,{
            method:"POST"
        });

        const data=await response.json();

        if(!response.ok){
            throw new Error(data.detail||"Request failed");
        }

        result.className="result success";
        result.style.display="block";

        result.innerHTML=`
            <h3>✅ Blog Published Successfully</h3>

            <p><strong>Title:</strong></p>

            <p>${data.title}</p>

            <br>

            <p><strong>Live URL:</strong></p>

            <a href="${data.url}" target="_blank">${data.url}</a>
        `;

    }

    catch(err){

        result.className="result error";
        result.style.display="block";

        result.innerHTML=`
            <h3>❌ Error</h3>
            <p>${err.message}</p>
        `;

    }

    finally{

        loader.style.display="none";
        button.disabled=false;

    }

});
</script>

</body>
</html>
